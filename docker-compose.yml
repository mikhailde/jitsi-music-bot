services:
  jitsi-bot:
    build: .
    container_name: jitsi-music-bot
    restart: unless-stopped
    init: true
    shm_size: '512m'
    stop_grace_period: 10s
    env_file: .env
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 500M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'